<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="../HTML/css/50.css">
</head>
<style>
    @media only screen and (max-width: 770px) {
         #fadeshow1 {
        display: none;
    }
    }
</style>
<body>
    <div class="login-box">
        <div class="owl" id="owl">
            <div class="hand"></div>
            <div class="hand hand-r"></div>
            <div class="arms">
                <div class="arm"></div>
                <div class="arm arm-r"></div>
            </div>
        </div>
        <div class="input-box">
            <form action="#" method="get">
                <input style="width: 350px;" width="300" type="text" placeholder="用户名" name="username">
                <br>
                <input style="width: 350px;" type="password" placeholder="密码" name="password">
                <br>
                <input style="width: 350px;" type="number" placeholder="学号" name="number" maxlength="10">
                <br>
                <input type="radio" name="sex">男 
                <input type="radio" name="sex">女
                <br>
                <select style="width: 350px; height: 50px;">
                    <option value="feicuihu">翡翠湖校区</option>
                    <option value="tunxilu">屯溪路校区</option>
                    <option value="xuancheng">宣城校区</option>
                    <option value="liuanlu">六安路校区</option>
                </select>
                <br>
                <br>
                <input style="width: 350px;" type="text" placeholder="手机号" name="phone">
                <br>
                <input style="width: 350px;" type="text" placeholder="QQ" name="QQ">
                <br>
                <input style="width: 350px;" type="text" placeholder="学院" name="Class">
                <br>

                <input style="width: 150px; height: 50px;"type="submit" value="立即注册">
                <p>已有帐号？点击<a href="50.html">登录</a></p>
            </form>
        </div>
    </div>
</body>
</html>
